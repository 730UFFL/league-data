<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>730UFFL</title>
<meta name="description" content="Standings, luck, and schedule analysis for the 730UFFL fantasy football league.">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🏈</text></svg>">
</head>
<body>

<header class="masthead">
  <h1>730UFFL</h1>
  <span class="sub" id="season-line">loading&hellip;</span>
  <span class="spacer"></span>
  <button id="theme-toggle" type="button" aria-label="Switch theme">Dark</button>
</header>

<div class="toolbar">
  <label for="season-select">Season</label>
  <select id="season-select"></select>
  <label for="team-select">Highlight team</label>
  <select id="team-select"></select>
  <span class="sub" id="updated-line"></span>
</div>

<nav class="tabs" role="tablist" aria-label="Views">
  <button class="tab" role="tab" data-view="standings">Standings</button>
  <button class="tab" role="tab" data-view="expected">Expected Wins</button>
  <button class="tab" role="tab" data-view="schedule">Schedule Luck</button>
  <button class="tab" role="tab" data-view="power">Power Rankings</button>
  <button class="tab" role="tab" data-view="quadrants">Quadrants</button>
  <button class="tab" role="tab" data-view="forecast">Forecast</button>
</nav>

<main id="view" role="tabpanel"></main>

<div class="tooltip" id="tooltip" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
